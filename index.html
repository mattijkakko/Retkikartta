<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retkikartta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --forest: #2d4a2d;
    --moss:   #4a7c4a;
    --lichen: #8fb88f;
    --bark:   #6b4f3a;
    --cream:  #f5f0e8;
    --sand:   #e8dfc8;
    --sky:    #c8dde8;
    --danger: #c0392b;
    --gold:   #c8a84b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--forest);
    color: var(--cream);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--forest);
    padding: 10px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(143,184,143,0.25);
    flex-shrink: 0;
    z-index: 1000;
  }

  .logo {
    font-family: 'Fraunces', serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--cream);
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo-icon { font-size: 1.1rem; }
  .logo span { color: var(--lichen); font-style: italic; font-weight: 300; }

  .mode-toggle {
    display: flex;
    gap: 6px;
  }
  .mode-btn {
    background: rgba(143,184,143,0.15);
    border: 1px solid rgba(143,184,143,0.3);
    color: var(--lichen);
    padding: 5px 10px;
    border-radius: 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--moss);
    border-color: var(--moss);
    color: var(--cream);
  }

  /* ── MAP ── */
  #map {
    flex: 1;
    position: relative;
    z-index: 1;
  }

  /* ── LEAFLET OVERRIDES ── */
  .leaflet-control-zoom {
    border: none !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3) !important;
  }
  .leaflet-control-zoom a {
    background: var(--forest) !important;
    color: var(--lichen) !important;
    border: 1px solid rgba(143,184,143,0.3) !important;
    font-size: 1.1rem !important;
    line-height: 30px !important;
    width: 30px !important;
    height: 30px !important;
  }
  .leaflet-control-zoom a:hover { background: var(--moss) !important; }
  .leaflet-control-attribution { display: none !important; }

  /* ── FLOATING ACTION BAR ── */
  .fab-row {
    position: absolute;
    bottom: 180px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 500;
  }

  .fab {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .fab:active { transform: scale(0.92); box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
  .fab-primary { background: var(--moss); color: var(--cream); }
  .fab-secondary { background: var(--bark); color: var(--cream); }
  .fab-danger { background: var(--danger); color: white; }
  .fab-locate { background: var(--sky); color: var(--forest); }

  /* ── BOTTOM PANEL ── */
  .bottom-panel {
    background: var(--forest);
    border-top: 1px solid rgba(143,184,143,0.25);
    flex-shrink: 0;
    z-index: 400;
    padding: 12px 16px 16px;
  }

  .panel-handle {
    width: 36px;
    height: 3px;
    background: rgba(143,184,143,0.4);
    border-radius: 2px;
    margin: 0 auto 10px;
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .stat-card {
    background: rgba(143,184,143,0.08);
    border: 1px solid rgba(143,184,143,0.2);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 2px;
  }
  .stat-label {
    font-size: 0.62rem;
    color: var(--lichen);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 8px;
  }
  .action-btn {
    flex: 1;
    padding: 9px 6px;
    border: 1px solid rgba(143,184,143,0.3);
    border-radius: 8px;
    background: rgba(143,184,143,0.08);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .action-btn:active { background: rgba(143,184,143,0.2); }
  .action-btn.primary-action {
    background: var(--moss);
    border-color: var(--moss);
    font-weight: 500;
  }

  /* Toast */
  #toast {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(45,74,45,0.95);
    border: 1px solid var(--moss);
    color: var(--cream);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.78rem;
    z-index: 900;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
    backdrop-filter: blur(6px);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Mode indicator */
  .mode-indicator {
    position: absolute;
    top: 70px;
    left: 12px;
    background: rgba(45,74,45,0.92);
    border: 1px solid var(--moss);
    color: var(--lichen);
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 0.7rem;
    z-index: 500;
    backdrop-filter: blur(4px);
    display: none;
  }
  .mode-indicator.visible { display: block; }

  /* Custom marker */
  .waypoint-marker {
    width: 18px;
    height: 18px;
    background: var(--gold);
    border: 2px solid var(--cream);
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .waypoint-marker.start {
    background: var(--moss);
    width: 22px;
    height: 22px;
  }
  .waypoint-marker.end {
    background: var(--danger);
    width: 22px;
    height: 22px;
  }

  /* Dog indicator */
  .dog-badge {
    position: absolute;
    top: 72px;
    right: 12px;
    font-size: 1.4rem;
    z-index: 500;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    transition: opacity 0.3s;
  }

  /* ── GPS TRACKING ── */
  .gps-dot {
    width: 16px; height: 16px;
    background: #4fc3f7;
    border: 3px solid white;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(79,195,247,0.6);
    animation: gpsPulse 2s infinite;
    position: relative;
  }
  @keyframes gpsPulse {
    0%   { box-shadow: 0 0 0 0 rgba(79,195,247,0.6); }
    70%  { box-shadow: 0 0 0 12px rgba(79,195,247,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,195,247,0); }
  }
  .gps-accuracy {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(79,195,247,0.15);
    border: 1px solid rgba(79,195,247,0.4);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Tracking button states */
  .fab-tracking { background: #4fc3f7; color: #1a1a2e; }
  .fab-tracking.active {
    background: var(--danger);
    color: white;
    animation: trackPulse 1.5s infinite;
  }
  @keyframes trackPulse {
    0%, 100% { box-shadow: 0 3px 12px rgba(192,57,43,0.4); }
    50%       { box-shadow: 0 3px 20px rgba(192,57,43,0.8); }
  }

  /* Track stats overlay */
  .track-overlay {
    position: absolute;
    top: 70px;
    left: 12px;
    background: rgba(20,40,20,0.92);
    border: 1px solid rgba(79,195,247,0.4);
    color: var(--cream);
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 0.72rem;
    z-index: 500;
    backdrop-filter: blur(6px);
    display: none;
    min-width: 140px;
  }
  .track-overlay.visible { display: block; }
  .track-overlay-title {
    font-size: 0.65rem;
    color: #4fc3f7;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .track-live-dot {
    width: 7px; height: 7px;
    background: var(--danger);
    border-radius: 50%;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .track-stat-row {
    display: flex;
    justify-content: space-between;
    margin-top: 3px;
    gap: 12px;
  }
  .track-stat-row span:last-child { color: var(--gold); font-weight: 500; }

  /* Center-on-me toggle */
  .center-toggle {
    position: absolute;
    bottom: 230px;
    left: 12px;
    background: rgba(20,40,20,0.88);
    border: 1px solid rgba(79,195,247,0.35);
    color: #4fc3f7;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    z-index: 500;
    cursor: pointer;
    backdrop-filter: blur(4px);
    display: none;
  }
  .center-toggle.visible { display: block; }
  .center-toggle.locked { background: rgba(79,195,247,0.2); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">🌲</span>
    Retki<span>kartta</span>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btnNormal" onclick="setMode('normal')">🚶 Kävely</button>
    <button class="mode-btn" id="btnDog" onclick="setMode('dog')">🐕 Koira</button>
  </div>
</header>

<div style="position:relative; flex:1; display:flex; flex-direction:column; overflow:hidden;">
  <div id="map"></div>

  <div class="fab-row">
    <button class="fab fab-tracking" id="fabTrack" onclick="toggleTracking()" title="GPS-seuranta">🛰️</button>
    <button class="fab fab-locate" onclick="locateOnce()" title="Sijaintini">📍</button>
    <button class="fab fab-secondary" onclick="undoLast()" title="Kumoa">↩️</button>
    <button class="fab fab-danger" onclick="clearRoute()" title="Tyhjennä">🗑️</button>
  </div>

  <!-- Live tracking overlay -->
  <div id="trackOverlay" class="track-overlay">
    <div class="track-overlay-title">
      <div class="track-live-dot"></div> Live-seuranta
    </div>
    <div class="track-stat-row"><span>Kuljettu</span><span id="trkDist">0 m</span></div>
    <div class="track-stat-row"><span>Aika</span><span id="trkTime">0:00</span></div>
    <div class="track-stat-row"><span>Nopeus</span><span id="trkSpeed">0.0 km/h</span></div>
    <div class="track-stat-row"><span>Tarkkuus</span><span id="trkAcc">–</span></div>
  </div>

  <!-- Center-lock toggle -->
  <button id="centerToggle" class="center-toggle locked" onclick="toggleCenter()">🔒 Seuraa sijaintia</button>

  <div id="modeIndicator" class="mode-indicator">✏️ Klikkaa karttaan lisätäksesi reittipisteitä</div>
  <div class="dog-badge" id="dogBadge" style="opacity:0">🐕</div>
  <div id="toast"></div>
</div>

<div class="bottom-panel">
  <div class="panel-handle"></div>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="statDist">0 km</div>
      <div class="stat-label">Pituus</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statTime">0 min</div>
      <div class="stat-label">Arvioitu aika</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statPoints">0</div>
      <div class="stat-label">Pistettä</div>
    </div>
  </div>
  <div class="actions">
    <button class="action-btn" onclick="changeLayer('osm')">🗺️ Peruskartta</button>
    <button class="action-btn" onclick="changeLayer('topo')">🏔️ Maasto</button>
    <button class="action-btn" onclick="changeLayer('hiking')">🥾 Reitit</button>
    <button class="action-btn primary-action" onclick="toggleDrawing()">✏️ Reitti</button>
  </div>
</div>

<script>
// ── MAP INIT ──────────────────────────────────────────────
const map = L.map('map', {
  center: [62.5, 25.7],
  zoom: 6,
  zoomControl: true,
  attributionControl: false
});

// Tile layers
const layers = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }),
  hiking: L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png', {
    maxZoom: 19, opacity: 0.8
  })
};

// Start with OSM + hiking overlay
layers.osm.addTo(map);
layers.hiking.addTo(map);

let activeBase = 'osm';
let hikeOverlay = true;

function changeLayer(name) {
  if (name === 'hiking') {
    // Toggle hiking overlay
    if (hikeOverlay) {
      map.removeLayer(layers.hiking);
      hikeOverlay = false;
      showToast('Reittien korostus pois päältä');
    } else {
      layers.hiking.addTo(map);
      hikeOverlay = true;
      showToast('Reittien korostus päällä 🥾');
    }
    return;
  }
  // Switch base layer
  map.removeLayer(layers[activeBase]);
  layers[name].addTo(map);
  if (hikeOverlay) layers.hiking.bringToFront();
  activeBase = name;
  showToast(name === 'osm' ? '🗺️ Peruskartta' : '🏔️ Maastokartta');
}

// ── STATE ─────────────────────────────────────────────────
let waypoints   = [];
let markers     = [];
let routeLine   = null;
let drawing     = false;
let withDog     = false;

// Speed: km/h (walking ~4.5 normal, ~3.5 with dog)
const SPEED_NORMAL = 4.5;
const SPEED_DOG    = 3.5;

// ── DRAWING ───────────────────────────────────────────────
function toggleDrawing() {
  drawing = !drawing;
  const indicator = document.getElementById('modeIndicator');
  if (drawing) {
    indicator.classList.add('visible');
    map.getContainer().style.cursor = 'crosshair';
    showToast('Klikkaa karttaan lisätäksesi pisteitä');
  } else {
    indicator.classList.remove('visible');
    map.getContainer().style.cursor = '';
    showToast('Piirtotila pois');
  }
}

map.on('click', function(e) {
  if (!drawing) return;
  addWaypoint(e.latlng);
});

function addWaypoint(latlng) {
  waypoints.push(latlng);
  const idx = waypoints.length - 1;
  const isFirst = idx === 0;

  const markerClass = isFirst ? 'waypoint-marker start' : 'waypoint-marker';
  const icon = L.divIcon({
    className: '',
    html: `<div class="${markerClass}"></div>`,
    iconSize: isFirst ? [22,22] : [18,18],
    iconAnchor: isFirst ? [11,11] : [9,9]
  });

  const marker = L.marker(latlng, { icon, draggable: true }).addTo(map);
  marker.on('drag', updateRoute);
  marker.on('contextmenu', function() {
    const i = markers.indexOf(marker);
    if (i !== -1) { waypoints.splice(i,1); markers[i].remove(); markers.splice(i,1); updateRoute(); }
  });
  markers.push(marker);
  updateRoute();
  updateStats();
}

function undoLast() {
  if (waypoints.length === 0) return;
  waypoints.pop();
  const last = markers.pop();
  if (last) last.remove();
  updateRoute();
  updateStats();
  showToast('Viimeinen piste poistettu');
}

function clearRoute() {
  waypoints = [];
  markers.forEach(m => m.remove());
  markers = [];
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  updateStats();
  showToast('Reitti tyhjennetty');
}

function updateRoute() {
  // Sync marker positions (after drag)
  waypoints = markers.map(m => m.getLatLng());
  if (routeLine) map.removeLayer(routeLine);
  if (waypoints.length < 2) return;

  // Update last marker icon to "end"
  markers.forEach((m, i) => {
    const isFirst = i === 0;
    const isLast  = i === markers.length - 1 && markers.length > 1;
    const cls = isFirst ? 'waypoint-marker start' : isLast ? 'waypoint-marker end' : 'waypoint-marker';
    const size = (isFirst || isLast) ? [22,22] : [18,18];
    const anchor = (isFirst || isLast) ? [11,11] : [9,9];
    m.setIcon(L.divIcon({ className:'', html:`<div class="${cls}"></div>`, iconSize:size, iconAnchor:anchor }));
  });

  routeLine = L.polyline(waypoints, {
    color: '#c8a84b',
    weight: 4,
    opacity: 0.9,
    dashArray: null,
    lineJoin: 'round',
    lineCap: 'round'
  }).addTo(map);

  updateStats();
}

// ── STATS ─────────────────────────────────────────────────
function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lng - a.lng) * Math.PI / 180;
  const x = Math.sin(dLat/2) ** 2 +
    Math.cos(a.lat * Math.PI/180) * Math.cos(b.lat * Math.PI/180) * Math.sin(dLon/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function updateStats() {
  let dist = 0;
  for (let i = 1; i < waypoints.length; i++) {
    dist += haversine(waypoints[i-1], waypoints[i]);
  }
  const speed = withDog ? SPEED_DOG : SPEED_NORMAL;
  const mins  = Math.round((dist / speed) * 60);

  document.getElementById('statDist').textContent   = dist < 1 ? (dist*1000).toFixed(0)+' m' : dist.toFixed(2)+' km';
  document.getElementById('statTime').textContent   = mins >= 60 ? `${Math.floor(mins/60)}h ${mins%60}min` : mins+' min';
  document.getElementById('statPoints').textContent = waypoints.length;
}

// ── MODE ──────────────────────────────────────────────────
function setMode(m) {
  withDog = (m === 'dog');
  document.getElementById('btnNormal').classList.toggle('active', !withDog);
  document.getElementById('btnDog').classList.toggle('active', withDog);
  document.getElementById('dogBadge').style.opacity = withDog ? '1' : '0';
  showToast(withDog ? '🐕 Koiratila – hitaampi tahti' : '🚶 Kävelytila');
  updateStats();
}

// ── GPS TRACKING ──────────────────────────────────────────
let tracking        = false;
let watchId         = null;
let gpsMarker       = null;
let gpsAccCircle    = null;
let trackPolyline   = null;
let trackPoints     = [];
let trackStartTime  = null;
let trackTimer      = null;
let centerLocked    = true;

// One-shot locate (📍 button)
function locateOnce() {
  showToast('Haetaan sijaintia…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
      map.setView(latlng, 14);
      placeGpsDot(latlng, pos.coords.accuracy);
      showToast('📍 Sijainti löydetty!');
      if (drawing) addWaypoint(latlng);
    },
    () => showToast('⚠️ Sijaintia ei löydy'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// Toggle continuous tracking
function toggleTracking() {
  tracking ? stopTracking() : startTracking();
}

function startTracking() {
  if (!navigator.geolocation) { showToast('⚠️ GPS ei tuettu'); return; }

  tracking       = true;
  trackPoints    = [];
  trackStartTime = Date.now();
  centerLocked   = true;

  document.getElementById('fabTrack').classList.add('active');
  document.getElementById('fabTrack').textContent = '⏹️';
  document.getElementById('trackOverlay').classList.add('visible');
  document.getElementById('centerToggle').classList.add('visible', 'locked');

  // Remove old track line
  if (trackPolyline) { map.removeLayer(trackPolyline); trackPolyline = null; }

  // Start watch
  watchId = navigator.geolocation.watchPosition(onGpsUpdate, onGpsError, {
    enableHighAccuracy: true,
    maximumAge: 3000,
    timeout: 15000
  });

  // Update elapsed time every second
  trackTimer = setInterval(updateTrackTime, 1000);
  showToast('🛰️ GPS-seuranta käynnistetty');
}

function stopTracking() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearInterval(trackTimer);
  tracking = false;

  document.getElementById('fabTrack').classList.remove('active');
  document.getElementById('fabTrack').textContent = '🛰️';
  document.getElementById('trackOverlay').classList.remove('visible');
  document.getElementById('centerToggle').classList.remove('visible');

  const dist = trackDistanceKm();
  showToast(`⏹️ Seuranta lopetettu – ${dist < 1 ? (dist*1000).toFixed(0)+' m' : dist.toFixed(2)+' km'}`);
}

function onGpsUpdate(pos) {
  const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
  const acc    = pos.coords.accuracy;
  const speed  = pos.coords.speed; // m/s or null

  // Update dot
  placeGpsDot(latlng, acc);

  // Record track point
  trackPoints.push(latlng);

  // Draw/update track line
  if (trackPoints.length > 1) {
    if (!trackPolyline) {
      trackPolyline = L.polyline(trackPoints, {
        color: '#4fc3f7', weight: 4, opacity: 0.85,
        lineJoin: 'round', lineCap: 'round'
      }).addTo(map);
    } else {
      trackPolyline.setLatLngs(trackPoints);
    }
  }

  // Pan if locked
  if (centerLocked) map.panTo(latlng, { animate: true, duration: 0.5 });

  // Update overlay stats
  const dist = trackDistanceKm();
  document.getElementById('trkDist').textContent  = dist < 1 ? (dist*1000).toFixed(0)+' m' : dist.toFixed(2)+' km';
  document.getElementById('trkAcc').textContent   = acc < 10 ? '✅ '+acc.toFixed(0)+'m' : acc.toFixed(0)+' m';

  if (speed !== null && speed >= 0) {
    document.getElementById('trkSpeed').textContent = (speed * 3.6).toFixed(1)+' km/h';
  } else if (trackPoints.length > 3) {
    // Estimate speed from last few points
    const n    = trackPoints.length;
    const prev = trackPoints[Math.max(0, n-5)];
    const dt   = 5; // ~5s between samples at best
    const ds   = haversine(prev, latlng) * 1000; // metres
    document.getElementById('trkSpeed').textContent = ((ds/dt)*3.6).toFixed(1)+' km/h';
  }
}

function onGpsError(err) {
  showToast('⚠️ GPS-virhe: ' + (err.message || 'tuntematon'));
}

function placeGpsDot(latlng, accuracy) {
  // Remove old
  if (gpsMarker)    { map.removeLayer(gpsMarker);    gpsMarker = null; }
  if (gpsAccCircle) { map.removeLayer(gpsAccCircle); gpsAccCircle = null; }

  // Accuracy circle
  if (accuracy && accuracy < 300) {
    gpsAccCircle = L.circle(latlng, {
      radius: accuracy,
      color: '#4fc3f7', fillColor: '#4fc3f7',
      fillOpacity: 0.08, weight: 1, opacity: 0.4
    }).addTo(map);
  }

  // Dot marker
  const icon = L.divIcon({
    className: '',
    html: `<div class="gps-dot"></div>`,
    iconSize: [16,16], iconAnchor: [8,8]
  });
  gpsMarker = L.marker(latlng, { icon, zIndexOffset: 1000 }).addTo(map);
}

function updateTrackTime() {
  if (!trackStartTime) return;
  const elapsed = Math.floor((Date.now() - trackStartTime) / 1000);
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;
  document.getElementById('trkTime').textContent =
    h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
}

function toggleCenter() {
  centerLocked = !centerLocked;
  const btn = document.getElementById('centerToggle');
  btn.classList.toggle('locked', centerLocked);
  btn.textContent = centerLocked ? '🔒 Seuraa sijaintia' : '🔓 Vapaa kartta';
  if (centerLocked && gpsMarker) map.panTo(gpsMarker.getLatLng());
}

function trackDistanceKm() {
  let d = 0;
  for (let i = 1; i < trackPoints.length; i++) d += haversine(trackPoints[i-1], trackPoints[i]);
  return d;
}

// Legacy map locate events (kept for compatibility)
map.on('locationfound', function(e) {});
map.on('locationerror', function() {});

// ── TOAST ─────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── INIT ──────────────────────────────────────────────────
showToast('Tervetuloa Retkikarttaan! 🌲');
</script>
